name: Ubuntu SSH Server

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: 2. Create User & Setup SSH
        run: |
          # ساخت کاربر جدید با پسورد
          sudo useradd -m -s /bin/bash sshuser
          echo "sshuser:P@ssw0rd1qazXSW@#" | sudo chpasswd
          sudo usermod -aG sudo sshuser
          
          # اجازه پسورد برای SSH
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          
          # ری‌استارت SSH
          sudo systemctl restart ssh
          
          echo "SSH configured!" 

      - name: 3. Show Connection Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "=================================================="
          echo "  >>> UBUNTU SSH SERVER IS READY! <<<"
          echo "=================================================="
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : sshuser"
          echo "  Password     : P@ssw0rd1qazXSW@#"
          echo ""
          echo "  Command: ssh sshuser@$TS_IP"
          echo "=================================================="

      - name: 4. Keep Server Alive (6 Hours Max)
        run: |
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] Ubuntu SSH server running... $(date +%H:%M:%S)"
          done
